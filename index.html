#pp{width:46px;height:46px;border-radius:50%;padding:0;flex:none}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px;margin-left:6px;vertical-align:middle}
.eq s{width:2px;height:25%;background:var(--r);animation:eq .9s infinite ease-in-out;animation-play-state:paused}
.eq s:nth-child(2){animation-delay:.2s}.eq s:nth-child(3){animation-delay:.45s}.eq s:nth-child(4){animation-delay:.1s}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.row>*{flex:1 1 130px}

.row>.card h3{font:800 30px var(--d);color:var(--t);letter-spacing:0;text-transform:none}
